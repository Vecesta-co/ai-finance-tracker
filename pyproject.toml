[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-finance-tracker"
version = "1.0.0"
description = "100% local-first personal finance tracker with dual-stage AI transaction categorization and anomaly detection by Vecesta.co."
readme = "README.md"
authors = [
  { name = "Vecesta.co", email = "vecesta.co@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
  "personal-finance",
  "budgeting",
  "transaction-categorization",
  "ai-categorizer",
  "local-first",
  "sqlite",
  "vecesta"
]
dependencies = [
  "pydantic>=2.0.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "requests>=2.28.0",
  "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
]

[project.scripts]
ai-finance-tracker = "src.cli:main"
aft = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
